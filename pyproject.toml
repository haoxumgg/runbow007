[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runbow007"
version = "0.1.0"
description = "李宁 TMS 订单提醒轻量自动化"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "haoxumgg" }]
dependencies = [
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "playwright==1.62.0",
  "portalocker>=3,<4",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "tzdata>=2024.1",
  "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
runbow007 = "runbow007.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=runbow007 --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
