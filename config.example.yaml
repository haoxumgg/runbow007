runtime:
  timezone: Asia/Shanghai
  data_dir: data
  downloads_dir: downloads
  logs_dir: logs
  browser_profile_dir: browser-profile
  database_path: data/runbow007.db
  lock_path: data/runbow007.lock
  retain_days: 30

tms:
  # 文档里的登录地址。全新浏览器每轮都要重新登录，直接落在登录页最确定。
  url: https://otb.lining.com/#/login
  # 只写账号。Windows 使用凭据管理器；Linux 使用 RUNBOW007_TMS_PASSWORD。
  username: ""
  headless: true
  # 每轮全新浏览器 + 重新登录，保证起点是确定的。持久化 profile 会把上一轮的
  # 标签页和 DOM 状态带过来，而 TMS 是标签页式 SPA、视图状态又按账号共享，
  # 结果每轮的页面结构都不一样。改成 true 可退回旧行为（例如频繁登录触发风控时）。
  persistent_profile: false
  navigation_timeout_seconds: 45
  # 实测 4900 单导出约 2–3 分钟即可完成。等待 10 分钟足够，且能保证三次重试
  # （0/60/180 秒退避）全部落在一小时的调度间隔内，不会吃掉下一个整点。
  download_timeout_seconds: 600
  # 点查询后等「拼命加载中」遮罩消失、表格出数据的上限。数据量大时会很慢。
  grid_load_timeout_seconds: 180
  # 单次尝试的硬上限，由 SIGALRM 强制中断。Playwright 的超时、循环 deadline、
  # 单轮预算在浏览器卡死时全部失效，这是唯一兜得住的一层。0 表示关闭。
  attempt_timeout_seconds: 900
  # 点击导出后，等下载中心「出现」本轮任务的上限。超过就认为点击没生效、重新导出。
  # 正常 1–2 分钟就会出现；高峰期会更慢。这个值 × 3 次尝试要留在 50 分钟的单轮
  # 预算内，8 分钟是保持三次重试的上限。
  export_task_appear_minutes: 8
  # 页面「共 N 条」与 Excel 唯一订单数比对时允许的漂移（读得到总数时才生效）。
  total_tolerance: 10
  # 下载中心「功能」列的匹配关键字，用截断后仍然保留的前缀。
  export_task_keyword: maintainCompanyOrd
  # 高级查找里要选中的预设。程序只选中并点「查询」，绝不点「保存」，
  # 预设里的日期条件（大于等于当月 1 号）由人工在 TMS 上维护。
  current_month_preset: AI导出数据（勿动）
  # 李宁 TMS 中配置好历史未完结查询后再填写。
  open_carryover_preset: ""
  # 以下选择器全部按《在TMS系统上下载数据》里抓的真实 DOM 校准，顺序即操作顺序。
  selectors:
    # 步骤一 登录
    username: "input[placeholder*='用户名'], input[placeholder*='账号'], input[name='username']"
    password: "input[type='password']"
    login_button: "button.submit-btn"
    # 步骤二 订单管理 → 集团订单管理。父子两级都叫「订单管理」，靠容器区分。
    order_menu: ".el-submenu__title"
    order_page_menu: "li.el-menu-item"
    # 步骤三 高级查找（注意是 #quickSearch，不是旁边那个放大镜 #searchItem）
    advanced_search_button: "#quickSearch"
    # 只按结构定位；触发器上显示的文字是「上一次用过的预设」，是变量。
    preset_trigger: ".page-header-title.el-popover__reference, span:has(> i.show-search-list)"
    preset_item: ".search-list .search-item"
    query_button: "button.thorn6-primary-button"
    total_count: "button.pagination-total"
    export_button: "button.round-btn:has(.thorn6-icon-daoru)"
    # 步骤四 下载中心。图标类名唯一且稳定，比文本匹配可靠。
    download_center_menu: "li.menu-item:has(.thorn6-icon-xiazai)"
    download_center_refresh: "#refreshItem"
    download_link: "a[href*='exportFileDowload']"

feishu:
  # 自建应用 App ID。Linux 通过 RUNBOW007_FEISHU_APP_SECRET 提供密钥。
  app_id: ""
  chat_id: oc_f79000009c4f09cbdf78b55fd35ae04a
  # 可选：留空时只发普通群消息；填写 open_id/user_id 后才会真正 @。
  mention_user_id: ""
  mention_name: 许昊
  request_timeout_seconds: 20

rules:
  enabled: [R1, R2, R3, R4]
  # 离厂时间为空，且北京时间已超过 WMS过账时间 + 90 分钟时提醒。
  wms_lead_minutes: 90
  # R3/R4 未解决异常每天从此小时开始允许再次提醒。
  unresolved_repeat_hour: 9
  # 命中项消失后至少安静这么多小时，再次出现才算新问题、才会立即重新提醒；
  # 时间更短的抖动仍受每日重复提醒规则约束，避免同一单被反复推送。
  reopen_grace_hours: 12
  # TMS 视图状态按账号共享且粘性：人工在浏览器里切过筛选，自动化下一轮会继承。
  # 本轮行数低于「最近一次成功运行 × 此比例」就拒绝处理，避免基于残缺数据发提醒。
  # 0 表示关闭。月初数据重置时可能触发，属正常现象。
  min_row_ratio: 0.5
  # 同理挡住「视图变大」——2026-08-17 18:12 实测继承到一个 12644 行的视图
  # （正常 4750），单向闸门放行了。0 表示关闭。
  max_row_ratio: 1.5
