runtime:
  timezone: Asia/Shanghai
  data_dir: data
  downloads_dir: downloads
  logs_dir: logs
  browser_profile_dir: browser-profile
  database_path: data/runbow007.db
  lock_path: data/runbow007.lock
  retain_days: 30

tms:
  url: https://otb.lining.com/#/
  # 只写账号。Windows 使用凭据管理器；Linux 使用 RUNBOW007_TMS_PASSWORD。
  username: ""
  headless: true
  # 每轮全新浏览器 + 重新登录，保证起点是确定的。持久化 profile 会把上一轮的
  # 标签页和 DOM 状态带过来，而 TMS 是标签页式 SPA、视图状态又按账号共享，
  # 结果每轮的页面结构都不一样。改成 true 可退回旧行为（例如频繁登录触发风控时）。
  persistent_profile: false
  navigation_timeout_seconds: 45
  # 实测 4672 单导出约 2–3 分钟即可完成。等待 10 分钟足够，且能保证两次尝试
  # （0/60 秒退避）全部落在 30 分钟的调度间隔内，不会吃掉下一个 slot。
  download_timeout_seconds: 600
  # 点查询后等「拼命加载中」遮罩消失、表格出数据的上限。数据量大时会很慢。
  grid_load_timeout_seconds: 180
  # 单次尝试的硬上限，由 SIGALRM 强制中断。Playwright 的超时、循环 deadline、
  # 单轮预算在浏览器卡死时全部失效，这是唯一兜得住的一层。0 表示关闭。
  # 2 次尝试 × 12 分钟 + 60 秒退避 = 25 分钟单轮预算，卡在 30 分钟调度间隔内。
  attempt_timeout_seconds: 720
  # 点击导出后，等下载中心「出现」本轮任务的上限。超过就认为点击没生效、重新导出。
  # 正常 1–2 分钟就会出现；高峰期会更慢。这个值必须小于 attempt_timeout_seconds，
  # 否则等待还没结束单次尝试就被看门狗打断了。
  export_task_appear_minutes: 8
  # 读取页面总数到 TMS 生成导出之间订单还在增减，允许的条数漂移。
  total_tolerance: 10
  current_month_preset: AI导出数据（勿动）
  # 李宁 TMS 中配置好历史未完结查询后再填写。
  open_carryover_preset: ""
  selectors:
    username: "input[name='username'], input[placeholder*='账号'], input[placeholder*='用户名']"
    password: "input[type='password']"
    # 以下选择器已按 hdrunbow 账号的真实页面校准。
    login_button: ".submit-btn"
    advanced_filter_button: "#searchItem"
    preset_name: ".el-dialog:visible .page-header-title"
    date_from_input: ".el-dialog:visible .el-date-editor input"
    query_button: ".el-dialog:visible button.el-button--primary"
    # 页面总数会与 Excel 唯一订单数强校验。
    total_count: "button.pagination-total"
    download_button: "button:has(.thorn6-icon-daochu), button:has(.thorn6-icon-daoru)"
    # 右上角全局菜单里的「下载中心」。图标类名唯一且稳定，比文本匹配可靠。
    download_center_menu: "ul.right_menu li.menu-item:has(.thorn6-icon-xiazai)"

feishu:
  # 自建应用 App ID。Linux 通过 RUNBOW007_FEISHU_APP_SECRET 提供密钥。
  app_id: ""
  chat_id: oc_f79000009c4f09cbdf78b55fd35ae04a
  # 可选：留空时只发普通群消息；填写 open_id/user_id 后才会真正 @。
  mention_user_id: ""
  mention_name: 许昊
  request_timeout_seconds: 20

rules:
  enabled: [R1, R2, R3, R4]
  # 离厂时间为空，且北京时间已超过 WMS过账时间 + 90 分钟时提醒。
  wms_lead_minutes: 90
  # R3/R4 未解决异常每天从此小时开始允许再次提醒。
  unresolved_repeat_hour: 9
  # 命中项消失后至少安静这么多小时，再次出现才算新问题、才会立即重新提醒；
  # 时间更短的抖动仍受每日重复提醒规则约束，避免同一单被反复推送。
  reopen_grace_hours: 12
  # TMS 视图状态按账号共享且粘性：人工在浏览器里切过筛选，自动化下一轮会继承。
  # 本轮行数低于「最近一次成功运行 × 此比例」就拒绝处理，避免基于残缺数据发提醒。
  # 0 表示关闭。月初数据重置时可能触发，属正常现象。
  min_row_ratio: 0.5
  # 同理挡住「视图变大」——2026-08-17 18:12 实测继承到一个 12644 行的视图
  # （正常 4750），单向闸门放行了。0 表示关闭。
  max_row_ratio: 1.5
