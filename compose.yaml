name: runbow007

services:
  app:
    build:
      context: .
      args:
        # 留空则使用 Debian 官方源；部署脚本会在国内服务器上填入阿里云镜像。
        APT_MIRROR: ${RUNBOW007_APT_MIRROR:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${RUNBOW007_PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: runbow007:local
    init: true
    ipc: host
    # 服务器只有 2 GiB 内存。2026-08-17 晚上一个卡死的 headless Chromium（当时正在
    # 渲染继承来的 12644 行错误视图）把内存吃干净，sshd fork 不出子进程，SSH 和
    # 阿里云命令助手同时失联，最后只能强制重启。加上限之后撑爆的是容器，机器还活着。
    mem_limit: 1200m
    mem_swappiness: 0
    env_file:
      - ${RUNBOW007_SECRETS_FILE:-./secrets.env}
    environment:
      TZ: Asia/Shanghai
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUNBOW007_TMS_DOWNLOAD_TIMEOUT_SECONDS: "600"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./browser-profile:/app/browser-profile
    security_opt:
      - no-new-privileges:true
