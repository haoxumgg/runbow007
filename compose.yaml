name: runbow007

services:
  app:
    build:
      context: .
    image: runbow007:local
    init: true
    ipc: host
    env_file:
      - ${RUNBOW007_SECRETS_FILE:-./secrets.env}
    environment:
      TZ: Asia/Shanghai
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUNBOW007_TMS_DOWNLOAD_TIMEOUT_SECONDS: "1200"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./browser-profile:/app/browser-profile
    security_opt:
      - no-new-privileges:true
