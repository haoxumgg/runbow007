name: runbow007

services:
  app:
    build:
      context: .
      # 默认值只写在 Dockerfile 里；这里留空表示「有同名环境变量就透传，没有就用
      # Dockerfile 的默认」，这样国内镜像源的默认值不会在两处各写一遍。
      args:
        PLAYWRIGHT_IMAGE:
        APT_MIRROR:
        PIP_INDEX:
    image: runbow007:local
    init: true
    ipc: host
    # 这里刻意不设 mem_limit。
    #
    # 历史：2026-08-17 晚上，一个卡死的 headless Chromium（当时正在渲染继承来的
    # 12644 行错误视图）在只有 2 GiB 的旧机器上把内存吃干净，sshd fork 不出子进程，
    # SSH 和阿里云命令助手同时失联，最后只能强制重启。当时加了 mem_limit: 1200m，
    # 让撑爆的是容器而不是整台机器。
    #
    # 2026-08-19 迁到新服务器，空闲内存 4 GiB，1200m 这个按 2 GiB 算出来的上限反而
    # 会让大数据量的那一轮被容器内 OOM 打断，于是按运维决定去掉上限。代价是上面那个
    # 失败模式回来了，只是需要更大的 runaway 才触发。真出现同类事故，恢复办法是把
    # mem_limit 加回来（建议 2g，而不是 1200m）。
    env_file:
      - ${RUNBOW007_SECRETS_FILE:-./secrets.env}
    environment:
      TZ: Asia/Shanghai
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUNBOW007_TMS_DOWNLOAD_TIMEOUT_SECONDS: "600"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./browser-profile:/app/browser-profile
    security_opt:
      - no-new-privileges:true
